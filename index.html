<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MFA-VEXPEX" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./mfa-default-avatar.jpg" />
    <title>MFA-VEXPEX | M-PESA Foundation Academy</title>
    <meta name="description" content="Exclusive Facebook network for M-PESA Foundation Academy scholars, faculty, and alumni." />
    <meta property="og:title" content="MFA-VEXPEX" />
    <meta property="og:description" content="Exclusive Facebook network for M-PESA Foundation Academy scholars, faculty, and alumni." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231877F2'/><text x='50%' y='64%' font-size='48' font-weight='900' fill='white' font-family='sans-serif' text-anchor='middle'>VP</text></svg>" />
  </head>
  <body class="bg-[#F0F2F5] text-[#050505] antialiased font-sans">
    <div id="root">
      <div id="boot-status" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F0F2F5;color:#050505">
        <div style="max-width:520px;text-align:center">
          <div style="font-size:28px;font-weight:800;color:#1877F2;margin-bottom:8px">MFA-VEXPEX</div>
          <div>Loading your academy network…</div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const showBootError = (message) => {
          const root = document.getElementById('root');
          if (!root || window.__MFA_VEXPEX_BOOTED__) return;
          root.textContent = '';
          const box = document.createElement('div');
          box.style.cssText = "font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F0F2F5;color:#050505";
          const inner = document.createElement('div');
          inner.style.cssText = "max-width:560px;background:white;border-radius:16px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center";
          const title = document.createElement('div');
          title.style.cssText = "font-size:24px;font-weight:800;color:#1877F2;margin-bottom:10px";
          title.textContent = 'MFA-VEXPEX could not start';
          const detail = document.createElement('div');
          detail.style.cssText = "font-size:14px;line-height:1.5;color:#65676B";
          detail.textContent = message || 'The browser stopped the app before it finished loading.';
          const retry = document.createElement('button');
          retry.textContent = 'Reload app';
          retry.style.cssText = "margin-top:18px;border:0;border-radius:10px;padding:11px 18px;background:#1877F2;color:white;font-weight:700;font-size:14px";
          retry.onclick = () => location.reload();
          inner.append(title, detail, retry);
          box.appendChild(inner);
          root.appendChild(box);
        };
        window.addEventListener('error', (event) => {
          showBootError(event.message || 'A required app script failed to load.');
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          showBootError(reason && reason.message ? reason.message : String(reason || 'An unexpected startup error occurred.'));
        });
        window.setTimeout(() => {
          if (!window.__MFA_VEXPEX_BOOTED__) {
            showBootError('The app script did not finish starting. This usually means the browser cached or blocked a JavaScript file.');
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
